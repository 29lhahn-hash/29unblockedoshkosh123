<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Snake - Vibe Games</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0d090a;
      color: #f3e9e3;
      font-family: system-ui, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
    }
    h1 { margin-bottom: 8px; font-size: 1.6rem; }
    #score { margin-bottom: 12px; color: #d0c0b8; }
    canvas {
      border: 2px solid #cf3d33;
      border-radius: 8px;
      background: #1a1214;
      box-shadow: 0 0 20px rgba(207,61,51,0.3);
    }
    .controls { margin-top: 14px; color: #d0c0b8; font-size: 0.9rem; text-align: center; }
    a.back {
      margin-top: 18px;
      color: #cf3d33;
      text-decoration: none;
      font-weight: 600;
    }
    a.back:hover { color: #e35248; }
  </style>
</head>
<body>
  <h1>Snake</h1>
  <div id="score">Score: 0</div>
  <canvas id="game" width="400" height="400"></canvas>
  <div class="controls">Arrow keys or WASD to move</div>
  <a class="back" href="index.html">← Back to Vibe Games</a>

  <script>
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');
    const grid = 20;
    let snake = [{x: 10, y: 10}];
    let dx = 1, dy = 0;
    let food = {x: 15, y: 15};
    let score = 0;
    let gameOver = false;

    function placeFood() {
      food.x = Math.floor(Math.random() * (canvas.width / grid));
      food.y = Math.floor(Math.random() * (canvas.height / grid));
    }

    function draw() {
      ctx.fillStyle = '#1a1214';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // food
      ctx.fillStyle = '#cf3d33';
      ctx.fillRect(food.x * grid, food.y * grid, grid - 2, grid - 2);

      // snake
      ctx.fillStyle = '#e59747';
      snake.forEach((s, i) => {
        ctx.fillStyle = i === 0 ? '#e59747' : '#cf3d33';
        ctx.fillRect(s.x * grid, s.y * grid, grid - 2, grid - 2);
      });
    }

    function update() {
      if (gameOver) return;

      const head = {x: snake[0].x + dx, y: snake[0].y + dy};

      if (head.x < 0 || head.x >= canvas.width / grid || head.y < 0 || head.y >= canvas.height / grid) {
        gameOver = true;
        alert('Game Over! Score: ' + score);
        return;
      }

      for (let s of snake) {
        if (s.x === head.x && s.y === head.y) {
          gameOver = true;
          alert('Game Over! Score: ' + score);
          return;
        }
      }

      snake.unshift(head);

      if (head.x === food.x && head.y === food.y) {
        score += 10;
        document.getElementById('score').textContent = 'Score: ' + score;
        placeFood();
      } else {
        snake.pop();
      }

      draw();
    }

    document.addEventListener('keydown', e => {
      if (['ArrowUp','w','W'].includes(e.key) && dy === 0) { dx = 0; dy = -1; }
      if (['ArrowDown','s','S'].includes(e.key) && dy === 0) { dx = 0; dy = 1; }
      if (['ArrowLeft','a','A'].includes(e.key) && dx === 0) { dx = -1; dy = 0; }
      if (['ArrowRight','d','D'].includes(e.key) && dx === 0) { dx = 1; dy = 0; }
    });

    placeFood();
    draw();
    setInterval(update, 100);
  </script>
</body>
</html>

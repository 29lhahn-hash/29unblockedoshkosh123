<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flappy Bird - Vibe Games</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0d090a;
      color: #f3e9e3;
      font-family: system-ui, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
    }
    h1 { margin-bottom: 8px; }
    #score { margin-bottom: 12px; color: #d0c0b8; }
    canvas {
      border: 2px solid #cf3d33;
      border-radius: 8px;
      background: #1a1214;
      box-shadow: 0 0 20px rgba(207,61,51,0.3);
    }
    .controls { margin-top: 14px; color: #d0c0b8; font-size: 0.9rem; }
    a.back {
      margin-top: 18px;
      color: #cf3d33;
      text-decoration: none;
      font-weight: 600;
    }
    a.back:hover { color: #e35248; }
  </style>
</head>
<body>
  <h1>Flappy Bird</h1>
  <div id="score">Score: 0</div>
  <canvas id="game" width="320" height="480"></canvas>
  <div class="controls">Space / Click / Tap to flap</div>
  <a class="back" href="index.html">← Back to Vibe Games</a>

  <script>
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');
    let birdY = 200, velocity = 0, gravity = 0.4, jump = -7;
    let pipes = [];
    let score = 0;
    let gameOver = false;
    let frame = 0;

    function reset() {
      birdY = 200;
      velocity = 0;
      pipes = [];
      score = 0;
      gameOver = false;
      frame = 0;
      document.getElementById('score').textContent = 'Score: 0';
    }

    function flap() {
      if (gameOver) { reset(); return; }
      velocity = jump;
    }

    document.addEventListener('keydown', e => { if (e.code === 'Space') { e.preventDefault(); flap(); } });
    canvas.addEventListener('click', flap);
    canvas.addEventListener('touchstart', e => { e.preventDefault(); flap(); });

    function update() {
      if (gameOver) return;

      velocity += gravity;
      birdY += velocity;

      if (birdY > canvas.height - 20 || birdY < 0) {
        gameOver = true;
        alert('Game Over! Score: ' + score);
        return;
      }

      if (frame % 90 === 0) {
        const gap = 120;
        const top = 50 + Math.random() * 200;
        pipes.push({ x: canvas.width, top: top, bottom: top + gap, passed: false });
      }

      pipes.forEach(p => {
        p.x -= 2;
        if (!p.passed && p.x + 40 < 60) {
          p.passed = true;
          score++;
          document.getElementById('score').textContent = 'Score: ' + score;
        }
        // collision
        if (p.x < 80 && p.x + 40 > 40) {
          if (birdY < p.top || birdY > p.bottom) {
            gameOver = true;
            alert('Game Over! Score: ' + score);
          }
        }
      });

      pipes = pipes.filter(p => p.x > -50);
      frame++;
    }

    function draw() {
      ctx.fillStyle = '#1a1214';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // pipes
      ctx.fillStyle = '#cf3d33';
      pipes.forEach(p => {
        ctx.fillRect(p.x, 0, 40, p.top);
        ctx.fillRect(p.x, p.bottom, 40, canvas.height - p.bottom);
      });

      // bird
      ctx.fillStyle = '#e59747';
      ctx.beginPath();
      ctx.arc(60, birdY, 12, 0, Math.PI * 2);
      ctx.fill();
    }

    function loop() {
      update();
      draw();
      requestAnimationFrame(loop);
    }

    loop();
  </script>
</body>
</html>

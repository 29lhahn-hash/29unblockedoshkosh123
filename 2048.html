<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>2048 - Vibe Games</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0d090a;
      color: #f3e9e3;
      font-family: system-ui, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }
    h1 { margin-bottom: 8px; }
    #score { margin-bottom: 12px; color: #d0c0b8; }
    #board {
      display: grid;
      grid-template-columns: repeat(4, 80px);
      grid-template-rows: repeat(4, 80px);
      gap: 8px;
      background: #1a1214;
      padding: 10px;
      border-radius: 12px;
      border: 2px solid #cf3d33;
      box-shadow: 0 0 20px rgba(207,61,51,0.3);
    }
    .cell {
      width: 80px;
      height: 80px;
      background: #2a1a1d;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.6rem;
      font-weight: 700;
    }
    .c2 { background: #3a282b; color: #f3e9e3; }
    .c4 { background: #4a3035; color: #f3e9e3; }
    .c8 { background: #cf3d33; color: #fff; }
    .c16 { background: #e35248; color: #fff; }
    .c32 { background: #e59747; color: #0d090a; }
    .c64 { background: #f0b060; color: #0d090a; }
    .c128 { background: #61b8cf; color: #0d090a; }
    .c256 { background: #4aa8c0; color: #fff; }
    .c512 { background: #cf3d33; color: #fff; font-size: 1.3rem; }
    .c1024 { background: #e59747; color: #0d090a; font-size: 1.2rem; }
    .c2048 { background: #61b8cf; color: #0d090a; font-size: 1.1rem; }
    .controls { margin-top: 14px; color: #d0c0b8; font-size: 0.9rem; }
    a.back {
      margin-top: 18px;
      color: #cf3d33;
      text-decoration: none;
      font-weight: 600;
    }
    a.back:hover { color: #e35248; }
  </style>
</head>
<body>
  <h1>2048</h1>
  <div id="score">Score: 0</div>
  <div id="board"></div>
  <div class="controls">Arrow keys to move</div>
  <a class="back" href="index.html">← Back to Vibe Games</a>

  <script>
    let board = Array(16).fill(0);
    let score = 0;

    function spawn() {
      const empty = board.map((v,i) => v === 0 ? i : -1).filter(i => i >= 0);
      if (empty.length === 0) return;
      const idx = empty[Math.floor(Math.random() * empty.length)];
      board[idx] = Math.random() < 0.9 ? 2 : 4;
    }

    function render() {
      const el = document.getElementById('board');
      el.innerHTML = board.map(v => {
        const cls = v ? 'c' + v : '';
        return `<div class="cell ${cls}">${v || ''}</div>`;
      }).join('');
      document.getElementById('score').textContent = 'Score: ' + score;
    }

    function slide(row) {
      let arr = row.filter(v => v);
      for (let i = 0; i < arr.length - 1; i++) {
        if (arr[i] === arr[i+1]) {
          arr[i] *= 2;
          score += arr[i];
          arr[i+1] = 0;
        }
      }
      arr = arr.filter(v => v);
      while (arr.length < 4) arr.push(0);
      return arr;
    }

    function move(dir) {
      let old = [...board];
      if (dir === 'left' || dir === 'right') {
        for (let r = 0; r < 4; r++) {
          let row = board.slice(r*4, r*4+4);
          if (dir === 'right') row.reverse();
          row = slide(row);
          if (dir === 'right') row.reverse();
          for (let c = 0; c < 4; c++) board[r*4+c] = row[c];
        }
      } else {
        for (let c = 0; c < 4; c++) {
          let col = [board[c], board[c+4], board[c+8], board[c+12]];
          if (dir === 'down') col.reverse();
          col = slide(col);
          if (dir === 'down') col.reverse();
          for (let r = 0; r < 4; r++) board[r*4+c] = col[r];
        }
      }
      if (board.some((v,i) => v !== old[i])) {
        spawn();
        render();
      }
    }

    document.addEventListener('keydown', e => {
      if (e.key === 'ArrowLeft') move('left');
      if (e.key === 'ArrowRight') move('right');
      if (e.key === 'ArrowUp') move('up');
      if (e.key === 'ArrowDown') move('down');
    });

    spawn();
    spawn();
    render();
  </script>
</body>
</html>
